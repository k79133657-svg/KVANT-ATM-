name: KVANT ATM APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q KvantATM_Android_Starter.zip -d project

      - name: Build APK
        run: |
          cd project/KvantATM_Android_Starter
          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KVANT-ATM-APK
          path: project/KvantATM_Android_Starter/app/build/outputs/apk/debug/*.apk
